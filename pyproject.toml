[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hanstream-asr"
version = "0.1.0"
description = "可复现的语音识别实验工具：声学特征、CTC 解码、中文英文评测与可训练基线。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Chen Yuxuan"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
model = ["torch>=2.5,<3"]
dev = ["build>=1.2", "hatchling>=1.26", "pytest>=8,<10", "pytest-cov>=5", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/hanstream"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: CPU neural model integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
